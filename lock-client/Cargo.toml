[workspace]
resolver = "2"
members = ["core", "firmware"]

# `firmware` only builds for riscv32imac-unknown-none-elf (the ESP32-C6), so it
# is excluded from a plain `cargo build`/`cargo test` run at the workspace
# root — those commands target the host. Build it explicitly with
# `cargo build -p lock-client-firmware --target riscv32imac-unknown-none-elf`.
default-members = ["core"]
