[package]
name = "lock-client-firmware"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lock-client-firmware"
path = "src/main.rs"
test = false
doctest = false

[dependencies]
lock-client-core = { path = "../core" }
esp-hal = { version = "1.2.2", features = ["esp32c3", "unstable"] }
esp-backtrace = { version = "0.20.0", features = ["esp32c3", "panic-handler", "println"] }
esp-println = { version = "0.18.0", features = ["esp32c3"] }
critical-section = "1.2"
heapless = { version = "0.9", default-features = false }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c3"] }

[profile.release]
opt-level = "s"
lto = true
