name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_server:
    name: Builds and tests the TOTP server

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose --manifest-path ./totp-server/Cargo.toml
    - name: Check formatting
      run: cargo fmt --manifest-path ./totp-server/Cargo.toml --check
    - name: Clippy
      run: cargo clippy --manifest-path ./totp-server/Cargo.toml --all-targets -- -D warnings
    # Unit tests plus the wiremock-backed introspection tests. These need no
    # Docker, so they gate every push.
    - name: Run tests
      run: cargo test --verbose --manifest-path ./totp-server/Cargo.toml

  integration_test_server:
    name: Runs the TOTP server integration tests against a real Keycloak

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # These are `#[ignore]`d by default because they start Postgres and Keycloak
    # containers via testcontainers; the GitHub runner has a Docker daemon.
    - name: Run integration tests
      run: cargo test --verbose --manifest-path ./totp-server/Cargo.toml --test e2e_integration -- --ignored

  build_client:
    name: Builds lock-client side code and does cross-compiling

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose --manifest-path ./lock-client/Cargo.toml
    - name: Run tests
      run: cargo test --verbose --manifest-path ./lock-client/Cargo.toml
    - name: Install Cross
      shell: bash
      run: |
        curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
        cargo binstall --no-confirm cross
    - name: Build for raspberry pi
      run: cross build --release --verbose --manifest-path ./lock-client/Cargo.toml --target armv7-unknown-linux-gnueabihf
    - name: Run tests for raspberry pi
      run: cross test --verbose --manifest-path ./lock-client/Cargo.toml --target armv7-unknown-linux-gnueabihf
    - name: upload artifact
      uses: actions/upload-artifact@v4
      with:
         name: raspberry pi executable
         path: ./**/target/*/release/lock-client
