name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_server:
    name: Builds and tests the TOTP server

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose --manifest-path ./totp-server/Cargo.toml
    - name: Check formatting
      run: cargo fmt --manifest-path ./totp-server/Cargo.toml --check
    - name: Clippy
      run: cargo clippy --manifest-path ./totp-server/Cargo.toml --all-targets -- -D warnings
    # Unit tests plus the wiremock-backed introspection tests. These need no
    # Docker, so they gate every push.
    - name: Run tests
      run: cargo test --verbose --manifest-path ./totp-server/Cargo.toml

  integration_test_server:
    name: Runs the TOTP server integration tests against a real Keycloak

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # These are `#[ignore]`d by default because they start Postgres and Keycloak
    # containers via testcontainers; the GitHub runner has a Docker daemon.
    - name: Run integration tests
      run: cargo test --verbose --manifest-path ./totp-server/Cargo.toml --test e2e_integration -- --ignored

  build_client_core:
    name: Builds and tests lock-client's hardware-independent logic

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # `lock-client`'s workspace default-members is just `core` — the firmware
    # crate only targets the ESP32-C6 and is built separately below. This
    # runs on the host, no embedded toolchain needed.
    - name: Build
      run: cargo build --verbose --manifest-path ./lock-client/Cargo.toml
    - name: Check formatting
      run: cargo fmt --manifest-path ./lock-client/core/Cargo.toml --check
    - name: Clippy
      run: cargo clippy --manifest-path ./lock-client/core/Cargo.toml --all-targets -- -D warnings
    - name: Run tests
      run: cargo test --verbose --manifest-path ./lock-client/Cargo.toml

  build_client_firmware:
    name: Builds the ESP32-C6 firmware

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install the RISC-V target
      run: rustup target add riscv32imac-unknown-none-elf
    # Run from within `firmware/` (not via --manifest-path) so Cargo picks up
    # `firmware/.cargo/config.toml`, which sets the target and the linker
    # flag esp-hal's generated linker script needs — both are resolved
    # relative to the working directory, not the manifest path.
    - name: Check formatting
      working-directory: ./lock-client/firmware
      run: cargo fmt --check
    - name: Clippy
      working-directory: ./lock-client/firmware
      run: cargo clippy --release -- -D warnings
    - name: Build
      working-directory: ./lock-client/firmware
      run: cargo build --release --verbose
    - name: upload artifact
      uses: actions/upload-artifact@v4
      with:
         name: esp32c6 firmware
         path: ./lock-client/target/riscv32imac-unknown-none-elf/release/lock-client-firmware

  simulate_client_firmware:
    name: Runs the Wiegand/TOTP/relay integration test in esp32sim

    runs-on: ubuntu-latest
    env:
      # Pins github.com/mikroverk/esp32sim (MIT, not vendored in this repo) to
      # a commit verified to work with lock-client/firmware/sim, rather than
      # always building its default branch — an upstream breaking change then
      # fails this job's checkout step with a clear "ref not found" instead of
      # silently changing what gets tested. Bump deliberately, re-verifying
      # locally first: see lock-client/firmware/sim/README.md.
      ESP32SIM_REF: 04f07602dba76eb6704b8901c989c9c9c1f8b42a
      # Pinned for the same reason, and so the cache key below is meaningful.
      ESPFLASH_VERSION: 4.6.0

    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: mikroverk/esp32sim
        ref: ${{ env.ESP32SIM_REF }}
        path: esp32sim

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install the RISC-V target
      run: rustup target add riscv32imac-unknown-none-elf

    - name: Cache esp32sim's build, the mask ROM, and espflash
      uses: actions/cache@v4
      with:
        path: |
          esp32sim/target
          esp32sim-roms
          ~/.cargo/bin/espflash
          ~/.cargo/registry
        key: esp32sim-${{ runner.os }}-${{ env.ESP32SIM_REF }}-${{ env.ESPFLASH_VERSION }}-${{ hashFiles('esp32sim/Cargo.lock') }}

    - name: Build esp32sim-c6
      working-directory: esp32sim
      run: cargo build --release --bin esp32sim-c6
    # Mask ROM ELFs (Apache-2.0, espressif/esp-rom-elfs), fetched by release
    # and SHA-256-verified by esp32sim's own script — see its comments for
    # what a real upgrade involves. Downloads the bundle for all chips, not
    # just the C6, harmlessly.
    - name: Fetch and verify the ESP32-C6 mask ROM
      working-directory: esp32sim
      run: sh tools/fetch-rom-elfs.sh "$GITHUB_WORKSPACE/esp32sim-roms"
    # --force: the cache step above restores ~/.cargo/bin/espflash from an
    # earlier run with the same key, and `cargo install` otherwise refuses to
    # overwrite a binary that's already there — found by the cache actually
    # hitting on a second run, not on the first (cold-cache) one.
    - name: Install espflash
      run: cargo install espflash@${{ env.ESPFLASH_VERSION }} --locked --force

    # Boots the real firmware binary under esp32sim's instruction-level
    # emulation of the real mask ROM and ESP-IDF bootloader, scripts a
    # Wiegand keypad entry on GPIO2/3, and checks the relay pin (GPIO10) over
    # a VCD waveform — see sim/README.md for what this does and does not
    # prove relative to real hardware.
    - name: Run the sim integration test
      working-directory: ./lock-client/firmware
      env:
        ESP32SIM_BIN: ${{ github.workspace }}/esp32sim/target/release/esp32sim-c6
        ESP32SIM_ROM_DIR: ${{ github.workspace }}/esp32sim-roms
      run: python3 sim/run_sim_tests.py
